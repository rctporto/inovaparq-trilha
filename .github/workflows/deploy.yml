name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# id-token: o GitHub emite um token que o Google aceita no lugar de uma chave
# (configurado uma vez com scripts/configurar-publicacao.sh, que informa os
# valores das variáveis do repositório usadas abaixo).
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Só publica depois que as variáveis do Firebase forem cadastradas no repositório.
    if: ${{ vars.FIREBASE_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - name: Publicar site e regras do banco
        run: npx firebase deploy --only hosting,firestore:rules --project "${{ vars.FIREBASE_PROJECT }}" --non-interactive
