name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# id-token: o GitHub emite um token que o Google aceita no lugar de uma chave
# (configurado uma vez com scripts/configurar-publicacao.sh).
permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT: inovaparq-trilha
  DEPLOY_SERVICE_ACCOUNT: github-deploy@inovaparq-trilha.iam.gserviceaccount.com
  WIF_PROVIDER: projects/797554163678/locations/global/workloadIdentityPools/github/providers/github

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Só publica quando WIF_PROVIDER estiver preenchido (antes disso, só confere se o site compila).
      - uses: google-github-actions/auth@v2
        if: env.WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Publicar site e regras do banco
        if: env.WIF_PROVIDER != ''
        run: npx firebase deploy --only hosting,firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
