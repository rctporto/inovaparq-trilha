# Firebase App Hosting (Next.js com servidor). Os segredos ficam no Cloud Secret Manager:
#   firebase apphosting:secrets:set DATABASE_URL   (e AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, BOOTSTRAP_DEV_EMAILS)
runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  memoryMiB: 512

scripts:
  # Aplica as migrations no banco antes de gerar o build.
  buildCommand: npm run build:apphosting

env:
  - variable: AUTH_TRUST_HOST
    value: "true"
  # Endereço público do site. Sem ele, o Auth.js monta os links de login com o host interno
  # do contêiner (localhost:8080). Troque aqui se o site ganhar um domínio próprio.
  - variable: AUTH_URL
    value: https://inovaparq-trilha--inovaparq-trilha.us-east4.hosted.app
  # E-mails que já nascem Desenvolvedor (separados por vírgula). Fica em segredo para não expor no repositório.
  - variable: BOOTSTRAP_DEV_EMAILS
    secret: BOOTSTRAP_DEV_EMAILS
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: AUTH_GOOGLE_ID
    secret: AUTH_GOOGLE_ID
  - variable: AUTH_GOOGLE_SECRET
    secret: AUTH_GOOGLE_SECRET
